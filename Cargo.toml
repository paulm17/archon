[package]
name = "archon"
version = "0.1.0"
edition = "2024"
default-run = "archon"

[workspace]
members = ["crates/*"]

[dependencies]
archon_scraper = { path = "crates/archon_scraper" }
archon_json = { path = "crates/archon_json" }
archon_scripture = { path = "crates/archon_scripture" }
rust-cef = { path = "../rust-cef" }
vardadb = { path = "../VardaDB" }
tokio = { version = "1", features = ["full"] }
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3.31"
tokio-stream = "0.1"
reqwest = { version = "0.11", features = ["json", "stream"] }
thiserror = "1.0"
toml = "0.8"
clap = { version = "4.5.59", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors"] }
libc = "0.2"
fastembed = "5.9.0"
regex = "1.12.3"
anyhow = "1.0"
async-graphql = "7.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
once_cell = "1.20"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
varda-client-rs = { path = "../VardaDB/client/rust" }
tempfile = "3"

[dev-dependencies]
dashmap = "6.1.0"

[[bin]]
name = "archon"
path = "src/main.rs"
