[badges]
dock = "./assets/dock.png"
taskbar = "./assets/tray.png"

[server]
port = 8000
storage_path = "./db_data"
embedding = true

[scripture-import]
input_dir = "./output/json"

[zenoh]
# Mode: "peer" (default, forms mesh) or "client" (requires connect)
mode = "peer"
# Connect: Empty for the root/seed node
connect = [] 
# Listen: Explicitly bind 7447 (Default Zenoh port)
listen = ["tcp/0.0.0.0:7448"] # Changed port to avoid conflict if VardaDB is also running
prefix = "archon/ops"

