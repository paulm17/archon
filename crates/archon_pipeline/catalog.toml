# ============================================================================
# catalog.toml — the domain registry
#
# This file describes WHAT exists: languages, sites, books, translations.
# It does not describe what to do on a given run — that is config.toml.
#
# Everything here is data. Only the parsing/validation code lives in Rust,
# selected by each site's `module`. Adding a language, a translation, or a
# whole new host on an existing platform is an edit to this file only.
#
# Output path is derived from (language, translation, book):
#
#     gospels/<language>/<translation>/<book>/chapter_<n>.html
#     json/<language>/<translation>/<book>/chapter_<n>.json
#
# e.g.  gospels/en/NIV/GEN/chapter_1.html
#       gospels/es/NVI/MRK/chapter_1.html
#       gospels/pt/NVI/MRK/chapter_1.html   <- same code, different language
# ============================================================================

version = 1


# ----------------------------------------------------------------------------
# BOOKS — the canonical canon, keyed by USFM
#
#   usfm       canonical id, also the directory name
#   name       English name
#   short      BibleGateway-style code (used when a site wants short slugs)
#   chapters   canonical chapter count
#   testament  ot | nt | dc (deuterocanonical)
#   slug       optional override for sites that spell a book unusually
#
# A translation may narrow this with `books = "nt"` (or an explicit list),
# drop books with `exclude = [...]`, or override a chapter count with
# `chapters = { DAN = 14 }`.
