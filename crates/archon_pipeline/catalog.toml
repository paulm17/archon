native = "עברית"


# ----------------------------------------------------------------------------
# SITES — one entry per platform, bound to the code module that parses it
#
#   module     the Rust implementation (parse + validate). Never data-driven.
#   url        chapter URL template. {language} {book} {chapter} {version}
#              {bible_id} are substituted from the translation row.
#   ready      CSS selector that must exist before the page is considered loaded
#   book_slug  how this site spells a book in a URL:
#                "usfm"  -> GEN, MRK, 1CO
#                "short" -> Gen, Mark, 1Cor
#                "lower" -> genesis, mark, 1_corinthians
#                "toc"   -> taken from the site's own contents page
# ----------------------------------------------------------------------------

[sites.bible_com]
name = "Bible.com"
module = "bible_com"
url = "https://www.bible.com/{language}/bible/{bible_id}/{book}.{chapter}.{version}"
ready = '[data-testid="chapter-content"]'
book_slug = "usfm"

[sites.ibep]
name = "IBEP (web components)"
module = "ibep"
ready = 'ibep-render-bible-content [data-verse-org-id]'
book_slug = "usfm"

[sites.bible_gateway]
name = "BibleGateway"
module = "bible_gateway"
url = "https://www.biblegateway.com/passage/?search={book}+{chapter}&version={version}"
ready = "div.passage-text"
book_slug = "short"

[sites.study_bible]
name = "StudyBible.info"
module = "study_bible"
url = "https://studybible.info/{version}/{book}.{chapter}"
ready = "div.parallel_passages_container"
book_slug = "short"

[sites.bible_hub]
name = "BibleHub (interlinear)"
module = "bible_hub"
url = "https://biblehub.com/interlinear/{book}/{chapter}.htm"
ready = "#fx iframe"          # interlinear words are rendered inside this iframe
book_slug = "lower"
interlinear = true

[sites.bible_hub_blb]
name = "BibleHub (Berean Literal Bible)"
module = "bible_hub_blb"
url = "https://biblehub.com/blb/{book}/{chapter}.htm"
ready = "#leftbox .grk .reftext"
book_slug = "lower"

[sites.sacred_bible]
name = "SacredBible.org"
module = "sacred_bible"
url = "https://sacredbible.org/catholic/{book}.htm"
ready = "a.chapter"
book_slug = "map"
unit = "book"

[sites.sacred_bible.book_codes]
