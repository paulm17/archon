# ----------------------------------------------------------------------------
# LANGUAGES — the top-level directory, and the language of everything below it
# ----------------------------------------------------------------------------
[languages.en]
name = "English"
native = "English"

[languages.es]
name = "Spanish"
native = "Español"

[languages.pt]
name = "Portuguese"
native = "Português"

[languages.fr]
name = "French"
native = "Français"

[languages.de]
name = "German"
native = "Deutsch"

[languages.it]
name = "Italian"
native = "Italiano"

[languages.ru]
name = "Russian"
native = "Русский"

[languages.am]
name = "Amharic"
native = "አማርኛ"

[languages.tl]
name = "Tagalog"
native = "Tagalog"

[languages.kr]
name = "Korean"
native = "한국어"

