[sites.oeb]
name = "Open English Bible"
module = "oeb"
url = "https://openenglishbible.org/oeb/{version}/{book}.html"
ready = "h5"                  # chapter headings; the page is static, no JS to wait on
book_slug = "toc"
unit = "book"          # one page holds the whole book; split into chapters at parse time

[sites.obd]
name = "Open Bible Data (freely-given.org)"
module = "obd"
url = "https://freely-given.org/OBD/{version}/byC/{book}_C{chapter}.htm"
ready = "h1#Top"              # static page; the adapter's validate() does the real checking
book_slug = "map"             # book codes come from the table below

# Every OBD version on the site carries the 66-book canon; the deuterocanonical
# books 404 for all seven, so asking for them can only ever produce failures.
exclude = [
  "TOB", "JDT", "ESG", "WIS", "SIR", "BAR", "LJE", "S3Y", "SUS", "BEL",
  "1MA", "2MA", "3MA", "4MA", "1ES", "2ES", "MAN", "PS2", "ADE",
]

# This site spells 22 books differently from USFM: its numbered books put the
# digit last (1SA -> SA1) and five are irregular. A book that is not listed
# falls back to its USFM id, so only the exceptions appear here.
[sites.obd.book_codes]
"1SA" = "SA1"
"2SA" = "SA2"
"1KI" = "KI1"
"2KI" = "KI2"
"1CH" = "CH1"
"2CH" = "CH2"
"1CO" = "CO1"
"2CO" = "CO2"
"1TH" = "TH1"
"2TH" = "TH2"
"1TI" = "TI1"
"2TI" = "TI2"
"1PE" = "PE1"
"2PE" = "PE2"
"1JN" = "JN1"
"2JN" = "JN2"
"3JN" = "JN3"
"EZK" = "EZE"
"JON" = "JNA"
"JAS" = "JAM"
"JUD" = "JDE"
"NAM" = "NAH"             # Nahum: the site uses NAH, not the USFM NAM


# ----------------------------------------------------------------------------
# TRANSLATIONS — grouped by language, then by site
#
#   code       directory name under <language>/; unique within a language
#   version    the site's own version identifier, substituted into {version}.
#              Defaults to `code` — only state it when the site disagrees.
#   bible_id   bible.com numeric edition id, substituted into {bible_id}
#   url        optional per-translation URL override
#   books      optional narrowing: "ot" | "nt" | "dc" | "all" | [usfm, ...]
#   exclude    optional list of usfm ids this edition does not contain
#   chapters   optional per-book chapter overrides
#   interlinear / unit  optional shape overrides (site defaults are inherited)
#
# The (language, code) pair is the identity, so es/NVI and pt/NVI coexist.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# BOOK ALIASES — site codes that match neither a canonical usfm nor `short`.
# Taken from what the live sites actually emit; `scraper books` regenerates
# these per translation into books/<TRANS>.json.
# ----------------------------------------------------------------------------
[book_aliases]
"3Ma"    = "3MA"
"4Ma"    = "4MA"
"PrAz"   = "S3Y"
"PrAzar" = "S3Y"
"1Macc"  = "1MA"
"2Macc"  = "2MA"
"3Macc"  = "3MA"
"4Macc"  = "4MA"


