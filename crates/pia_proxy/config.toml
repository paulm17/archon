# pia-proxy configuration
#
# Credentials are not stored here: the proxy reads PIA_USER / PIA_PASS from the
# environment, which the app loads from the project's .env file.
#
# This file holds only the listener, rotation and region settings.

[listen]
host = "127.0.0.1"
port = 8889

[rotation]
max_attempts = 3          # upstreams tried per client connection
cooldown_secs = 60        # a retired region is out of rotation this long, then probed again
connect_timeout_secs = 12 # whole budget for one client connection, shared between its attempts;
                          # keep it well under [timing].navigation in the app's config.toml

# Regions are PIA ids from serverlist.piaservers.net/vpninfo/servers/v6.
# Any region with WireGuard servers works. `port` pins a region to its own
# local port, gluetun style, in addition to the round-robin listener.
[[regions]]
name = "CA Montreal"
id = "ca"
port = 9000

[[regions]]
name = "CA Ontario"
id = "ca_ontario"
port = 9001

[[regions]]
name = "CA Toronto"
id = "ca_toronto"
port = 9002

